# Alembic Configuration for ProtegEla

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Configuração da URL de conexão (sobrescrita dinamicamente em env.py a partir do core.config)
sqlalchemy.url = postgresql://protegela_user:protegela_secret_dev_pass@localhost:5432/protegela_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
